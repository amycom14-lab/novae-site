<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="robots" content="noindex" />
  <title>Page introuvable — NOVAE</title>
  <style>
    :root {
      --bg: #06080f;
      --ink: #f4f7ff;
      --muted: #a3aec4;
      --lime: #d8ff5e;
      --line: rgba(255, 255, 255, 0.1);
    }
    * { margin: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
      background:
        radial-gradient(800px 560px at 78% -10%, rgba(79, 140, 255, 0.22), transparent 62%),
        radial-gradient(700px 520px at 0% 40%, rgba(168, 85, 247, 0.14), transparent 60%),
        var(--bg);
      color: var(--ink);
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 520px; text-align: center; }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 40px;
      color: var(--ink);
      text-decoration: none;
      font-family: "Space Grotesk", system-ui, sans-serif;
      font-weight: 700;
      letter-spacing: 0.18em;
    }
    .mark {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: linear-gradient(140deg, #4f8cff, #a855f7);
      box-shadow: 0 8px 24px rgba(79, 140, 255, 0.32);
    }
    .mark svg { width: 24px; height: 24px; }
    .code {
      font-family: "Space Grotesk", system-ui, sans-serif;
      font-size: clamp(80px, 20vw, 130px);
      font-weight: 600;
      line-height: 1;
      letter-spacing: -0.05em;
      background: linear-gradient(100deg, #7fb0ff, #b98cff 48%, #5ff0e4);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    h1 {
      margin: 18px 0 12px;
      font-family: "Space Grotesk", system-ui, sans-serif;
      font-size: clamp(24px, 5vw, 32px);
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    p { color: var(--muted); font-size: 15px; line-height: 1.6; }
    .btn {
      display: inline-flex;
      margin-top: 30px;
      padding: 13px 24px;
      border-radius: 999px;
      background: var(--lime);
      color: #080b12;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 36px rgba(216, 255, 94, 0.28);
    }
  </style>
</head>
<body>
  <main class="wrap">
    <a class="brand" href="/">
      <span class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M12 2.2c.55 4.7 3.1 7.25 7.8 7.8-4.7.55-7.25 3.1-7.8 7.8-.55-4.7-3.1-7.25-7.8-7.8 4.7-.55 7.25-3.1 7.8-7.8Z" fill="#fff"/>
          <circle cx="18.6" cy="18.4" r="1.9" fill="#fff" opacity=".85"/>
        </svg>
      </span>
      NOVAE
    </a>
    <p class="code">404</p>
    <h1>Cette page s'est perdue.</h1>
    <p>Le lien est peut-être ancien ou mal orthographié. Revenez à l'accueil pour continuer.</p>
    <a class="btn" href="/">Retour à l'accueil</a>
  </main>
</body>
</html>
